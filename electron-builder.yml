appId: com.bapbap.launcher.v2
productName: BAPBAP Nexus
directories:
  output: release/build
  buildResources: build
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
afterPack: scripts/electron-builder-after-pack.cjs
extraResources:
  - from: build/icon.ico
    to: icon.ico
extraMetadata:
  main: dist/main/main.cjs
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
  artifactName: "${productName} Setup ${version}.${ext}"
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
    - deb
  category: "Game"
  icon: build/icon.ico
  # desktop: optional integration for .desktop files
